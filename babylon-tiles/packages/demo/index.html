<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Babylon.js Tile Map Demo</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
			}
			#renderCanvas {
				width: 100%;
				height: 100%;
				touch-action: none;
			}
			#info {
				position: absolute;
				top: 10px;
				left: 10px;
				background: rgba(0, 0, 0, 0.7);
				color: white;
				padding: 10px;
				border-radius: 5px;
				font-family: Arial, sans-serif;
				font-size: 14px;
				pointer-events: none;
			}
			#stats {
				position: absolute;
				top: 10px;
				right: 10px;
				background: rgba(0, 0, 0, 0.7);
				color: white;
				padding: 10px;
				border-radius: 5px;
				font-family: monospace;
				font-size: 12px;
				pointer-events: none;
			}
			#loading {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				background: rgba(0, 0, 0, 0.8);
				color: white;
				padding: 20px 40px;
				border-radius: 10px;
				font-family: Arial, sans-serif;
				font-size: 18px;
				display: none;
			}
		</style>
	</head>
	<body>
		<canvas id="renderCanvas"></canvas>
		<div id="info">
			<div><strong>Babylon.js Tile Map</strong></div>
			<div id="location"></div>
			<div id="level"></div>
		</div>
		<div id="stats">
			<div>FPS: <span id="fps">0</span></div>
			<div>Tiles: <span id="tiles">0</span></div>
			<div>Downloading: <span id="downloading">0</span></div>
		</div>
		<div id="loading">Loading...</div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
