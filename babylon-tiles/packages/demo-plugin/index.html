<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Babylon.js Tile Map - Plugin Demo</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
				font-family: Arial, sans-serif;
			}
			#renderCanvas {
				width: 100%;
				height: 100%;
				touch-action: none;
			}
			#toolbar {
				position: absolute;
				top: 10px;
				left: 50%;
				transform: translateX(-50%);
				display: flex;
				gap: 6px;
				background: rgba(0, 0, 0, 0.6);
				padding: 8px 12px;
				border-radius: 8px;
				z-index: 10;
			}
			#toolbar button {
				background: #ffffff22;
				color: #fff;
				border: 1px solid #ffffff55;
				border-radius: 4px;
				padding: 4px 10px;
				font-size: 13px;
				cursor: pointer;
			}
			#toolbar button:hover {
				background: #ffffff55;
			}
			#toolbar button.active {
				background: #ff9800;
				border-color: #ff9800;
			}
			#stats {
				position: absolute;
				top: 10px;
				right: 10px;
				background: rgba(0, 0, 0, 0.7);
				color: white;
				padding: 10px;
				border-radius: 5px;
				font-family: monospace;
				font-size: 12px;
				pointer-events: none;
				z-index: 10;
			}
			#compass {
				position: absolute;
				bottom: 20px;
				left: 20px;
				width: 110px;
				height: 110px;
				z-index: 10;
			}
			#info {
				position: absolute;
				bottom: 10px;
				right: 10px;
				background: rgba(0, 0, 0, 0.6);
				color: white;
				padding: 8px 12px;
				border-radius: 5px;
				font-size: 12px;
				pointer-events: none;
				z-index: 10;
			}
			#loading {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				background: rgba(0, 0, 0, 0.8);
				color: white;
				padding: 20px 40px;
				border-radius: 10px;
				font-size: 18px;
				display: none;
				z-index: 20;
			}
		</style>
	</head>
	<body>
		<canvas id="renderCanvas"></canvas>
		<div id="toolbar">
			<button data-view="影像" class="active">影像</button>
			<button data-view="线框">线框</button>
			<button data-view="调试">调试</button>
			<button data-view="法线">法线</button>
			<button data-view="高程">高程</button>
			<button data-view="Logo">Logo</button>
			<button data-view="GeoJSON">GeoJSON</button>
			<button id="btn-filter">滤镜</button>
		</div>
		<div id="stats">
			<div>FPS: <span id="fps">0</span></div>
			<div>Tiles: <span id="tiles">0</span></div>
			<div>相机 yaw/pitch/roll</div>
			<div><span id="cam">-</span></div>
		</div>
		<div id="compass"></div>
		<div id="info">
			<div>左键平移 · 右键旋转 · 滚轮缩放</div>
			<div id="location"></div>
		</div>
		<div id="loading">Loading...</div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
